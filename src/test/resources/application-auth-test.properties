## Auth test profile
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.main.allow-bean-definition-overriding=true

# Redis for tests - will be overridden by Testcontainers
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT - short-lived for faster tests
auth.jwt.access-token-expiry-seconds=900
auth.jwt.refresh-token-expiry-seconds=604800
auth.jwt.issuer=banking-mvp-test
auth.jwt.audience=banking-mvp-api-test

# Password
auth.password.min-length=12
auth.password.require-uppercase=true
auth.password.require-lowercase=true
auth.password.require-digit=true
auth.password.require-special=true
auth.password.check-have-i-been-pwned=false

# Lockout
auth.lockout.max-failed-attempts=5
auth.lockout.initial-lockout-seconds=300
auth.lockout.max-lockout-seconds=86400
auth.lockout.lockout-multiplier=2.0

# Rate limit - high for tests to avoid interference
auth.rate-limit.requests-per-minute=1000
auth.rate-limit.login-requests-per-minute=100

# Session
auth.session.max-concurrent-sessions=5
auth.session.idle-timeout-seconds=1800

# MFA
auth.mfa.totp-window-seconds=30
auth.mfa.totp-tolerance=1
auth.mfa.backup-code-count=8
auth.mfa.backup-code-length=10
auth.mfa.issuer=BankingMVP-Test

# CORS - explicit for tests
auth.cors.allowed-origins=http://localhost:3000,http://localhost:8080

# Email
auth.email.enabled=false
auth.email.resend-cooldown-minutes=5
auth.email.max-resend-attempts=3

# Disable Efí Bank
efi.webclient.enabled=false
efi.pix.client-id=fake
efi.pix.client-secret=fake
efi.pix.sandbox=true
efi.pix.base-url-override=http://localhost:9999
efi.pix.certificate-path=fake-cert.p12
efi.pix.certificate-password=
efi.pix.notification-url=http://localhost:9999/webhook
efi.pix.response-timeout-in-seconds=30
efi.boleto.client-id=fake
efi.boleto.client-secret=fake
efi.boleto.sandbox=true
efi.boleto.certificate-path=fake-cert.p12
efi.boleto.certificate-password=
efi.boleto.notification-url=http://localhost:9999/boleto-webhook
efi.boleto.response-timeout-in-seconds=30

# Encryption key for tests
auth.encryption.key=qpv6JuDUCX0a3AAJDRFC13xjhtR/7IcBDD39wTDJ1EY=

# Logging
logging.level.root=WARN
logging.level.com.miqu3iasg.banking.auth=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.testcontainers=WARN

outbox.processor.enabled=false
