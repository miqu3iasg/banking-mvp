## Postgres
spring.datasource.driver-class-name = org.postgresql.Driver
spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.show-sql = true
spring.datasource.hikari.maximum-pool-size=20

banking.retry.max-attempts=15

# Logging configuration for tests
logging.level.root=INFO
logging.level.com.miqu3iasg=DEBUG
logging.level.software.amazon.awssdk=WARN
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN

# Efí Bank PIX
efi.pix.client-id=fake-client-id
efi.pix.client-secret=fake-client-secret
efi.pix.certificate-path=classpath:test-cert.p12
efi.pix.certificate-password=changeit
efi.pix.sandbox=true
efi.pix.charge-expires-in-seconds=3600
efi.pix.response-timeout-in-seconds=30
efi.pix.webhook-url=http://localhost:9999/webhook/pix
efi.pix.base-url-override=fake-url

# Efí Bank Boleto
efi.boleto.client-id=fake-client-id
efi.boleto.client-secret=fake-client-secret
efi.boleto.certificate-path=classpath:test-cert.p12
efi.boleto.certificate-password=changeit
efi.boleto.sandbox=true
efi.boleto.response-timeout-in-seconds=30
efi.boleto.notification-url=http://localhost:9999/webhook/boleto

# Encryption key for tests
auth.encryption.key=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=

# Disable unnecessary auto-configurations for faster test startup
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

outbox.processor.enabled=false
