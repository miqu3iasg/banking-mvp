## application-e2e-test.properties

# Datasource
# Overridden by @DynamicPropertySource in each test class
# Defaults prevent bean validation failure on context startup
spring.datasource.driver-class-name = org.postgresql.Driver
spring.jpa.hibernate.ddl-auto = create-drop

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.root=INFO
logging.level.com.miqu3iasg=DEBUG
logging.level.software.amazon.awssdk=WARN
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN

# Efí Bank Sandbox credentials
# Set these via environment variables; never commit real values.
# CI: store as CI_EFI_CLIENT_ID, CI_EFI_CLIENT_SECRET, etc.
efi.pix.client-id=${EFI_CLIENT_ID}
efi.pix.client-secret=${EFI_CLIENT_SECRET}
efi.pix.certificate-path=${EFI_CERT_PATH}
efi.pix.certificate-password=${EFI_CERT_PASSWORD}
efi.pix.sandbox=true
efi.pix.charge-expires-in-seconds=3600
efi.pix.response-timeout-in-seconds=30
efi.pix.webhook-url=${EFI_WEBHOOK_URL}

efi.boleto.client-id=${EFI_CLIENT_ID}
efi.boleto.client-secret=${EFI_CLIENT_SECRET}
efi.boleto.certificate-path=${EFI_CERT_PATH}
efi.boleto.certificate-password=${EFI_CERT_PASSWORD}
efi.boleto.sandbox=true
efi.boleto.response-timeout-in-seconds=30
efi.boleto.notification-url=${EFI_BOLETO_NOTIFICATION_URL}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=600s

retry.max-attempts=3
retry.base-delay-ms=500
retry.multiplier=2

spring.task.scheduling.pool.size=1
