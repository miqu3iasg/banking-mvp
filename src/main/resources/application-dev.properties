# PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://localhost:5434/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Caching
spring.cache.type=caffeine
spring.cache.cache-names=efi-oauth-token,cnpj
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=3000s

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# SQL logging via Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.stat=DEBUG

# Connection pool logging (HikariCP is Spring Boot's default)
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG

# Spring JDBC / Transactions
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG

# Spring Data JPA repositories
logging.level.org.springframework.data.jpa.repository=DEBUG

spring.config.import=optional:file:.env

# Docker
spring.docker.compose.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus,info,logfile
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.prometheus.metrics.export.enabled=true
management.security.username=${MANAGEMENT_USER}
management.security.password=${MANAGEMENT_PASSWORD}
# Tag application name
management.metrics.tags.application=banking-mvp-metrics

# Outbox Processor
outbox.processor.interval-ms=5000

# Efí Bank PIX integration
efi.pix.client-id=${EFI_CLIENT_ID}
efi.pix.client-secret=${EFI_CLIENT_SECRET}
efi.pix.certificate-path=${EFI_CERT_PATH}
efi.pix.certificate-password=${EFI_CERT_PASSWORD:}
efi.pix.sandbox=true
efi.pix.charge-expires-in-seconds=3600
efi.pix.response-timeout-in-seconds=30
efi.pix.webhook-url=${EFI_WEBHOOK_URL}

# Efí Bank Boleto integration
efi.boleto.client-id=${EFI_CLIENT_ID}
efi.boleto.client-secret=${EFI_CLIENT_SECRET}
efi.boleto.certificate-path=${EFI_CERT_PATH}
efi.boleto.certificate-password=${EFI_CERT_PASSWORD:}
efi.boleto.sandbox=true
efi.boleto.response-timeout-in-seconds=30
efi.boleto.notification-url=${EFI_BOLETO_NOTIFICATION_URL}

# Resilience4j — Circuit Breaker
#resilience4j.circuitbreaker.instances.efiBank.slidingWindowSize=10
#resilience4j.circuitbreaker.instances.efiBank.failureRateThreshold=50
#resilience4j.circuitbreaker.instances.efiBank.waitDurationInOpenState=30s
#resilience4j.circuitbreaker.instances.efiBank.permittedNumberOfCallsInHalfOpenState=3
#resilience4j.circuitbreaker.instances.efiBank.recordExceptions[0]=java.util.concurrent.TimeoutException
#resilience4j.circuitbreaker.instances.efiBank.recordExceptions[1]=org.springframework.web.reactive.function.client.WebClientRequestException
#resilience4j.circuitbreaker.instances.efiBank.recordExceptions[2]=com.miqu3iasg.banking.pix.domain.exception.PixGatewayException

# Resilience4j — Retry
resilience4j.retry.instances.efiBank.maxAttempts=3
resilience4j.retry.instances.efiBank.waitDuration=500ms
resilience4j.retry.instances.efiBank.enableExponentialBackoff=true
resilience4j.retry.instances.efiBank.exponentialBackoffMultiplier=2
resilience4j.retry.instances.efiBank.retryExceptions[0]=org.springframework.web.reactive.function.client.WebClientRequestException
resilience4j.retry.instances.efiBank.retryExceptions[1]=java.util.concurrent.TimeoutException
resilience4j.retry.instances.efiBank.ignoreExceptions[0]=com.miqu3iasg.banking.shared.exception.BusinessException

# Retry configuration
banking.retry.max-attempts=3
banking.retry.base-delay-ms=50
banking.retry.multiplier=2.0
banking.retry.max-delay-ms=500

# Scheduling
spring.task.scheduling.pool.size=2

# Scheduler configurations
# Boleto Expiration Scheduler - runs daily at 02:00 UTC
boleto.expiration.cron=0 0 2 * * *
boleto.expiration.enabled=true
# Pix Expiration Job - runs daily at 02:00 UTC
pix.expiration.cron=0 0 2 * * *
pix.expiration.enabled=true
# Outbox Processor - processes events every 5 seconds
outbox.processor.cron=0 0/5 * * * *
outbox.processor.enabled=true
# Idempotency Service - runs daily at midnight
idempotency.purge.cron=0 0 0 * * *
idempotency.purge.enabled=true

# Compliance: BrasilAPI
brasil-api.base-url=https://brasilapi.com.br/api
brasil-api.connect-timeout-seconds=3
brasil-api.read-timeout-seconds=5
