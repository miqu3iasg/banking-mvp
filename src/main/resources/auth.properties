auth:
  jwt:
    access-token-expiry-seconds: 900
    refresh-token-expiry-seconds: 604800
    key-size: 2048
    public-key-path: 
    private-key-path: 
    issuer: banking-mvp
    audience: banking-mvp-api

  password:
    min-length: 12
    history-count: 10
    expiry-days: 90
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special: true
    min-special-chars: 1
    check-have-i-been-pwned: false

  lockout:
    max-failed-attempts: 5
    initial-lockout-seconds: 300
    max-lockout-seconds: 86400
    lockout-multiplier: 2.0

  rate-limit:
    requests-per-minute: 100
    login-requests-per-minute: 10
    password-reset-per-hour: 5

  session:
    max-concurrent-sessions: 5
    idle-timeout-seconds: 1800

  mfa:
    totp-window-seconds: 30
    totp-tolerance: 1
    backup-code-count: 8
    backup-code-length: 10
    issuer: BankingMVP

  redis:
    timeout-seconds: 2
    fail-open: false

  email:
    enabled: true
    resend-cooldown-minutes: 5
    max-resend-attempts: 3
