global:
  scrape_interval: 5s
scrape_configs:
  - job_name: 'banking-mvp'
    static_configs:
      - targets: [ 'host.docker.internal:8085' ]
        labels:
          application: 'banking-mvp-metrics'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'prometheus'
      password: 'prometheus'
